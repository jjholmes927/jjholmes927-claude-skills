name: Version check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  versions-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON parses
        run: |
          jq empty plugin.json
          jq empty .claude-plugin/marketplace.json

      - name: plugin.json and marketplace.json versions match
        run: |
          PLUGIN=$(jq -r '.version' plugin.json)
          MARKETPLACE=$(jq -r '.version' .claude-plugin/marketplace.json)
          ENTRY=$(jq -r '.plugins[] | select(.name == "joel-workflow") | .version' .claude-plugin/marketplace.json)
          echo "plugin.json:                    $PLUGIN"
          echo "marketplace.json (top-level):   $MARKETPLACE"
          echo "marketplace.json (plugin entry): $ENTRY"
          if [ "$PLUGIN" != "$MARKETPLACE" ] || [ "$PLUGIN" != "$ENTRY" ]; then
            echo "::error::Version mismatch — bump all three to the same value (plugin.json .version, marketplace.json .version, marketplace.json plugin entry .version)"
            exit 1
          fi

  version-bumped-on-content-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version bump when plugin content changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              echo "No comparable base for this push — skipping."
              exit 0
            fi
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- skills commands install.sh plugin.json .claude-plugin/marketplace.json)
          if [ -z "$CHANGED" ]; then
            echo "No plugin content changed — version bump not required."
            exit 0
          fi
          echo "Changed plugin content:"
          echo "$CHANGED"
          OLD=$(git show "$BASE":plugin.json | jq -r '.version')
          NEW=$(jq -r '.version' plugin.json)
          echo "Base version: $OLD — PR version: $NEW"
          python3 - "$OLD" "$NEW" <<'PY'
          import re, sys
          versions = sys.argv[1:]
          if any(not re.fullmatch(r"\d+\.\d+\.\d+", value) for value in versions):
              raise SystemExit("Plugin versions must use major.minor.patch")
          old, new = (tuple(map(int, value.split("."))) for value in versions)
          if new <= old:
              raise SystemExit("Plugin content changed; increase all three version fields")
          PY

  frontmatter-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML frontmatter parses in every command and skill
        run: |
          ruby -ryaml -e '
            failures = []
            Dir["commands/*.md", "skills/**/SKILL.md"].each do |f|
              lines = File.read(f).lines
              unless lines.first&.strip == "---"
                failures << "#{f}: missing frontmatter"
                next
              end
              close = lines[1..].index { |l| l.strip == "---" }
              if close.nil?
                failures << "#{f}: unterminated frontmatter"
                next
              end
              begin
                metadata = YAML.safe_load(lines[1, close].join)
                unless metadata.is_a?(Hash) && metadata["description"].is_a?(String) && !metadata["description"].strip.empty?
                  failures << "#{f}: missing description"
                end
                if f.start_with?("skills/") && metadata.is_a?(Hash) && metadata["name"] != File.basename(File.dirname(f))
                  failures << "#{f}: name must match its directory"
                end
              rescue => e
                failures << "#{f}: #{e.message}"
              end
            end
            failures.each { |m| puts "::error::#{m}" }
            abort "#{failures.size} file(s) with invalid frontmatter" unless failures.empty?
            puts "Frontmatter valid in all commands and skills."
          '

  adapter-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: marketplace
      - uses: actions/checkout@v4
        with:
          repository: jjholmes927/dotfiles
          path: dotfiles
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -B dotfiles/workflow/check-release.py --source marketplace
